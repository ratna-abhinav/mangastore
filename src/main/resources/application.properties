spring.application.name=shoppingdotcom

server.port=${PORT:8080}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.mail.host=smtp.gmail.com
spring.mail.username=${SENDER_EMAIL}
spring.mail.password=${APP_PASSWORD}
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


neon.s3.endpoint=${AWS_ENDPOINT_URL_S3}
neon.s3.region=${AWS_REGION}
neon.s3.access-key=${AWS_ACCESS_KEY_ID}
neon.s3.secret-key=${AWS_SECRET_ACCESS_KEY}
neon.bucket-name=${NEON_BUCKET}

gemini.api.key=${GEMINI_API_KEY:}

spring.profiles.active=${ENV:dev}

# signup activation mode: admin (default) or email
app.signup.activation-mode=${SIGNUP_ACTIVATION_MODE:admin}
# set to true + real Google creds to enable "Sign in with Google"
app.signup.google-enabled=${GOOGLE_ENABLED:false}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}



