spring.application.name=shoppingdotcom

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.mail.host=smtp.gmail.com
spring.mail.username=${SENDER_EMAIL}
spring.mail.password=${APP_PASSWORD}
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


neon.s3.endpoint=${AWS_ENDPOINT_URL_S3}
neon.s3.region=${AWS_REGION}
neon.s3.access-key=${AWS_ACCESS_KEY_ID}
neon.s3.secret-key=${AWS_SECRET_ACCESS_KEY}
neon.bucket-name=${NEON_BUCKET}

spring.profiles.active=${ENV:dev}



