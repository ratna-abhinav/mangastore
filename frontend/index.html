<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Resolve the theme before first paint so there is no flash.
      (function () {
        try {
          var stored = localStorage.getItem('mangastore-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf8ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#06040d" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <title>MangaStore — Manga, Manhwa &amp; Donghua</title>
    <meta
      name="description"
      content="MangaStore is your destination for manga, Korean manhwas and Chinese donghuas. Browse curated genres, fill your cart and follow your orders in real time."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MangaStore — Manga, Manhwa &amp; Donghua" />
    <meta
      property="og:description"
      content="Curated manga, manhwa and donghua. One endless shelf."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="icon"

    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"
    />

</html>
